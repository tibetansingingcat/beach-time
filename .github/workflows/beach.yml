name: beach

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours; forecast models update about that often
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}beach.ics
    steps:
      - uses: actions/checkout@v7
      - run: python3 beach.py --test
      - run: mkdir site && cd site && python3 ../beach.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
